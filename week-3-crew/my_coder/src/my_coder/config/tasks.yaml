coding_task:
  description: >
    Write python code to achieve this: {assignment}
  expected_output: >
    A text file that includes the code itself, along with the output of the code.
  agent: coder
  output_file: output/code_and_output.txt

code_evaluator_task:
  description: >
    Evaluate the final python code generated by coder agent to achieve this: {assignment}
  expected_output: >
    A text file that includes the code itself, and whether the code is correct or not, with a short rationale behind your evaluation.
  agent: code_evaluator
  output_file: output/code_evaluation.txt